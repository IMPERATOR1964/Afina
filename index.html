<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Афина ❤</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <!-- Оверлей с фото при неправильном ответе -->
  <div id="wrong-overlay" class="wrong-overlay hidden">
    <div class="wrong-overlay-content">
      <img src="images/wrong.jpg" alt="" onerror="this.classList.add('placeholder')" />
      <p class="wrong-text">Не угадала ❤ Попробуй ещё раз</p>
    </div>
  </div>

  <main class="layout">
    <!-- Левая колонка с фото -->
    <aside class="side side-left">
      <img src="images/photo1.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
      <img src="images/photo2.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
      <img src="images/photo3.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
    </aside>

    <!-- Центр: опросник и финал -->
    <section class="center">
      <!-- Опросник -->
      <div id="quiz" class="card">
        <h1>Привет, моя маленькая ❤</h1>
        <p class="subtitle">Ответь на пару вопросов про нас</p>

        <form id="quiz-form" class="quiz-form">
          <!-- Правильный ответ помечается атрибутом data-correct="true" -->
          <div class="question">
            <h3>1. Когда мы познакомились?</h3>
            <label><input type="radio" name="q1" value="a" /> Весной</label>
            <label><input type="radio" name="q1" value="b" /> Летом</label>
            <label><input type="radio" name="q1" value="c" data-correct="true" /> Осенью</label>
            <label><input type="radio" name="q1" value="d" /> Зимой</label>
          </div>

          <!-- В этом вопросе все ответы правильные -->
          <div class="question">
            <h3>2. Кого я больше всего люблю?</h3>
            <label><input type="radio" name="q2" value="a" data-correct="true" /> Тебя</label>
            <label><input type="radio" name="q2" value="b" data-correct="true" /> Еще раз тебя</label>
            <label><input type="radio" name="q2" value="c" data-correct="true" /> Свою пикмушку</label>
            <label><input type="radio" name="q2" value="d" data-correct="true" /> Афиночку</label>
          </div>

          <div class="question">
            <h3>3. Карбюратор?</h3>
            <label><input type="radio" name="q3" value="a" data-correct="true" /> Инжектор</label>
            <label><input type="radio" name="q3" value="b" /> Инспектор</label>
            <label><input type="radio" name="q3" value="c" /> Проектор</label>
            <label><input type="radio" name="q3" value="d" /> Маектор</label>
          </div>

          <div class="question">
            <h3>4. Какого числа мы познакомились?</h3>
            <label><input type="radio" name="q4" value="a" data-correct="true" /> 18.05.2025</label>
            <label><input type="radio" name="q4" value="b" /> 18.05.2225</label>
            <label><input type="radio" name="q4" value="c" /> 18.05.2205</label>
            <label><input type="radio" name="q4" value="d" /> 18.05.2255</label>
          </div>

          <button type="submit" class="btn">Ответить ❤</button>
        </form>
      </div>

      <!-- Финал: появляется после опросника -->
      <div id="final" class="card hidden">
        <h1 class="big-title">Вместе уже год ❤</h1>
        <p class="subtitle">И это только начало нашей истории</p>

        <div class="gallery">
          <img src="images/g1.jpg" alt="" onerror="this.classList.add('placeholder')" />
          <img src="images/g2.jpg" alt="" onerror="this.classList.add('placeholder')" />
          <img src="images/g3.jpg" alt="" onerror="this.classList.add('placeholder')" />
          <img src="images/g4.jpg" alt="" onerror="this.classList.add('placeholder')" />
          <img src="images/g5.jpg" alt="" onerror="this.classList.add('placeholder')" />
          <img src="images/g6.jpg" alt="" onerror="this.classList.add('placeholder')" />
        </div>

        <p class="signature">Я тебя люблю ❤</p>
      </div>
    </section>

    <!-- Правая колонка с фото -->
    <aside class="side side-right">
      <img src="images/photo4.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
      <img src="images/photo5.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
      <img src="images/photo6.jpg" alt="" class="side-photo" onerror="this.classList.add('placeholder')" />
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
